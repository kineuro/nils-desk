[package]
name = "nils-desk"
version = "1.0.0-alpha.7"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/kineuro/nils-desk"
homepage = "https://kineuro.se"
authors = ["Karolinska Institutet Neuro Research Group"]
publish = false
description = "The desk of NILS: one origin, the session, the proxy and the deployment capabilities document"

[dependencies]
axum = { version = "0.8", features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
bytes = "1"
http = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
# Wave 4c B2: the local issuer (EdDSA), the passwords (argon2id), the
# provider's tokens (RS256/ES256/EdDSA by JWKS) and PKCE (S256).
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
argon2 = "0.5"
base64 = "0.22"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
url = "2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[lints.clippy]
all = "warn"
