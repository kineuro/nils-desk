# nils-desk.toml: the desk's configuration. Copy beside the binary and edit.

# Where the desk listens, and the origin a browser reaches it at: the
# cross-origin defences compare every write's Origin against this.
bind = "127.0.0.1:7200"
origin = "http://127.0.0.1:7200"

# Other addresses this same desk answers at, when a browser may reach it by more
# than one: the machine's own address beside the loopback, a host name beside an
# address. A write carrying one of them is the desk's own; everything the desk
# advertises, mints and redirects to stays the `origin` above.
# also_origins = ["http://192.168.0.30:7200", "http://localhost:7200"]

# off: one person on one machine, every grant, no login.
# local: users the desk keeps; the desk is a small issuer the engine trusts.
# oidc: an identity provider; the desk is a confidential client with PKCE,
# and still signs the tokens the parts receive.
mode = "off"

# What exporting a result needs: a grant, or a ladder name (reader, reviewer,
# operator, admin) standing for its set, or "off". query:work unless set.
# export = "query:work"

# Where people sign in, the desk signs the tokens the parts receive, with the
# grants and the detail each person holds: the EdDSA signing key, made at first
# start, mode 600, and the audience the tokens carry (what the engine's trust
# entry names). People get pages from groups, and an install starts with
# Readers, Reviewers, Operators and Admins. The first user:
# `nils-desk user add anna --admin` (password on stdin), who joins Admins; the
# rest get groups and grants on the Identity page, or with `nils-desk group`
# and `nils-desk user access`.
# The engine runs with
#   --auth oidc --oidc-trust issuer=<origin>,audience=nils,jwks=<origin>/.well-known/jwks.json,keep_subject=true
# and in oidc mode with the provider's entry beside it, as the settings page
# and `nils-desk register` print them.
# [local]
# key = "nils-desk.key"
# audience = "nils"

# oidc mode: what `nils-desk register --authentik URL --token FILE --origin
# <origin> --allow GROUP --bind reader=GROUP ...` prints. A group at the desk
# follows the provider groups in groups_claim; an entitlement in roles_claim
# stands for its ladder set until a group follows a provider group.
# [oidc]
# issuer = "https://auth.example.org/application/o/nils/"
# client_id = "..."
# client_secret_file = "nils-desk.client-secret"
# scopes = ["openid", "profile", "email", "offline_access", "entitlements"]
# groups_claim = "groups"
# roles_claim = "roles"

# The one SQLite file: sessions, display names, local users, groups and what
# each person holds.
store = "nils-desk.sqlite"

[engine]
url = "http://127.0.0.1:8080"
# The bearer the desk holds for the engine (--auth token); leave out under
# --auth off. A browser never sees it.
# token = "..."

# [kvasir]
# url = "http://127.0.0.1:7100"

# [assistant]
# url = "http://127.0.0.1:7300"

# One section per registered app, proxied under /apps/{id}/ with the
# person's token and the same defences, for a person holding its
# entitlement: a grant, or a ladder name standing for its set.
# [[apps]]
# id = "pipelines"
# title = "Analysis pipelines"
# url = "http://127.0.0.1:7400"
# entitlement = "pipelines:work"
# capabilities = "/capabilities"
