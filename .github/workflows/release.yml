name: release
# On a version tag: build `nils-desk` for every target, check that the binary
# carries the tag's version, and publish a GitHub release with the binaries and
# their checksums, in the form the engine and Bifrost use.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build:
    uses: ./.github/workflows/desk-build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nils-desk-*
          path: bin
          merge-multiple: true
      - name: the binaries carry the tag's version
        run: |
          v=${GITHUB_REF_NAME#v}
          chmod +x bin/nils-desk-*
          got=$(bin/nils-desk-linux-x86_64 --version)
          [ "$got" = "nils-desk $v" ] || { echo "tag says $v, the binary says '$got': raise version in desk/Cargo.toml first"; exit 1; }
          (cd bin && sha256sum nils-desk-* > SHA256SUMS && echo "$v" > VERSION && ls -la)
      - name: release notes
        run: |
          v=${GITHUB_REF_NAME#v}
          if [ -f CHANGELOG.md ]; then
            awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md | sed '1d' > notes.md
          fi
          [ -s notes.md ] || echo "The NILS desk $v" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: nils-desk ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            bin/nils-desk-*
            bin/SHA256SUMS
            bin/VERSION

  image:
    # The same binaries, in an image for the two Linux architectures, so that
    # `nils setup` can put the desk in a container without building one.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nils-desk-linux-*
          path: bin
          merge-multiple: true
      - name: the names the Containerfile expects
        run: |
          mv bin/nils-desk-linux-x86_64 bin/nils-desk-linux-amd64
          chmod +x bin/nils-desk-linux-*
          ls -la bin
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: install/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kineuro/nils-desk:${{ github.ref_name }}
            ghcr.io/kineuro/nils-desk:latest
