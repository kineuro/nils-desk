name: release
# On a version tag: `nils-desk` for every target, checked to carry the tag's
# version, published as a GitHub release with the binaries and their checksums, in
# the form the engine and Bifrost use. A tag goes on a commit once ci passed on
# main, and that run built the binaries with desk-build.yml, so the release takes
# them from it; where no run on main kept them, they are built here the same way.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  built:
    name: the binaries ci built
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success" --jq '.workflow_runs[0].id // empty')
          if [ -n "$run" ]; then
            kept=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired | not) | select(.name | startswith("nils-desk-"))] | length')
            [ "$kept" -ge 5 ] || run=""
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then echo "the binaries ci run $run built"; else echo "no run on main kept this commit's binaries, so they are built here"; fi

  build:
    needs: built
    if: needs.built.outputs.run == ''
    uses: ./.github/workflows/desk-build.yml

  release:
    needs: [built, build]
    if: ${{ !cancelled() && needs.built.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nils-desk-*
          path: bin
          merge-multiple: true
          run-id: ${{ needs.built.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
      - name: the binaries carry the tag's version
        run: |
          v=${GITHUB_REF_NAME#v}
          chmod +x bin/nils-desk-*
          got=$(bin/nils-desk-linux-x86_64 --version)
          [ "$got" = "nils-desk $v" ] || { echo "tag says $v, the binary says '$got': raise version in desk/Cargo.toml first"; exit 1; }
          (cd bin && sha256sum nils-desk-* > SHA256SUMS && echo "$v" > VERSION && ls -la)
      - name: release notes
        run: |
          v=${GITHUB_REF_NAME#v}
          if [ -f CHANGELOG.md ]; then
            awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md | sed '1d' > notes.md
          fi
          [ -s notes.md ] || echo "The NILS desk $v" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: nils-desk ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            bin/nils-desk-*
            bin/SHA256SUMS
            bin/VERSION

  image:
    # The same binaries, in an image for the two Linux architectures, so that
    # `nils setup` can put the desk in a container without building one.
    needs: [built, build]
    if: ${{ !cancelled() && needs.built.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nils-desk-linux-*
          path: bin
          merge-multiple: true
          run-id: ${{ needs.built.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
      - name: the names the Containerfile expects
        run: |
          mv bin/nils-desk-linux-x86_64 bin/nils-desk-linux-amd64
          chmod +x bin/nils-desk-linux-*
          ls -la bin
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: install/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kineuro/nils-desk:${{ github.ref_name }}
            ghcr.io/kineuro/nils-desk:latest
