name: ci
# The desk on every pull request and on main: the front end built by vite, then the
# Rust binary formatted, linted and tested with that front end embedded. On main the
# release targets are built as well (desk-build.yml), so a tag takes those binaries
# rather than building them again.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # a newer push to a pull request stops the run it replaces; a run on main is never stopped
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX headers on every source file
        run: scripts/check-spdx.sh
      - name: the theme is one file
        run: scripts/check-theme.sh
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: the front end
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx vitest run
          npm run build
      - name: the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' desk/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk
      - name: format
        working-directory: desk
        run: cargo fmt --all --check
      - name: lint
        working-directory: desk
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: desk
        run: cargo test
      - name: the binary serves the front end it embeds
        working-directory: desk
        run: |
          cargo build
          test -s ../web/dist/index.html
  layout:
    # the reader on one screen (record 48): chromium measures the rating page at
    # 1440 by 900 and 1366 by 768 and refuses any scroll, page or panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: the reader fits one screen
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
  build:
    # on main only: the binaries a release of this commit takes
    if: github.event_name == 'push'
    uses: ./.github/workflows/desk-build.yml
