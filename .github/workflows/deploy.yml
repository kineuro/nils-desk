name: deploy
# Wave 5 W0: every merge to main builds the desk here (the front end, then the
# binary that embeds it) and puts it on the group's guest through the gateway; the
# guest's own apply script restarts it. The workflow knows a gateway name, a target
# name and a secret, and nothing else of the deployment.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: the front end
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' desk/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk
      - name: the binary
        working-directory: desk
        run: cargo build --release --locked
      - name: through the gateway to the guest, then apply
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null key; printf '%s\n' "$KEY" > key
          cat > known_hosts <<'KH'
          ssh.kineuro.se ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAc27JgEFQrzEDT9X+VschGd2qq5EjoDVbb0tFTyzdfX
          KH
          cat > sshcfg <<'CFG'
          Host nils
            HostName ssh.kineuro.se
            User deploy:nils-deploy
            IdentityFile key
            IdentitiesOnly yes
            UserKnownHostsFile known_hosts
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 40
            ProxyCommand openssl s_client -quiet -verify_return_error -verify 5 -connect ssh.kineuro.se:443 -servername ssh.kineuro.se 2>/dev/null
          CFG
          mkdir -p out/desk && cp desk/target/release/nils-desk out/desk/
          rsync -az --delete -e "ssh -F sshcfg" out/desk/ nils:/srv/nils/incoming/desk/
          ssh -F sshcfg nils "/srv/nils/bin/apply desk"
