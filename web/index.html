<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NILS</title>
    <!-- the theme a person chose, before the first paint, so a dark desk never flashes light -->
    <script>
      try {
        var theme = localStorage.getItem("nils-desk.theme");
        if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/brand/nils-mark-256.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/nils-mark-16.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
